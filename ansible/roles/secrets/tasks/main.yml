---
# Idempotent + stable: generate the DB password ONCE. On re-runs the existing
# Secret is kept, so PostgreSQL data stays consistent. The password is never
# written to disk or git — it lives only in the Kubernetes Secret.

- name: Check whether the DB secret already exists
  ansible.builtin.command: >-
    kubectl -n {{ app_namespace }} get secret {{ db_secret_name }} -o name
  register: existing_secret
  changed_when: false
  failed_when: false

- name: Generate a random database password (first run only)
  ansible.builtin.set_fact:
    generated_db_password: "{{ lookup('password', '/dev/null length=' ~ db_password_length ~ ' chars=ascii_letters,digits') }}"
  when: existing_secret.rc != 0

- name: Generate a Flask secret key (first run only)
  ansible.builtin.set_fact:
    generated_flask_key: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
  when: existing_secret.rc != 0

- name: Create the DB secret (first run only)
  ansible.builtin.command: >-
    kubectl -n {{ app_namespace }} create secret generic {{ db_secret_name }}
    --from-literal=DB_PASSWORD={{ generated_db_password }}
    --from-literal=FLASK_SECRET_KEY={{ generated_flask_key }}
  when: existing_secret.rc != 0
  no_log: true
  register: secret_created
  changed_when: secret_created.rc == 0

- name: Report secret state
  ansible.builtin.debug:
    msg: >-
      {{ 'Created new secret ' ~ db_secret_name if existing_secret.rc != 0
         else 'Secret ' ~ db_secret_name ~ ' already exists; keeping it.' }}
