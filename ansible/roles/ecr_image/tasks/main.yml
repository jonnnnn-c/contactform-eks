---
- name: Discover ECR repository URL from Terraform output (if not provided)
  ansible.builtin.command: terraform -chdir={{ repo_root }}/terraform output -raw ecr_repository_url
  register: tf_ecr
  changed_when: false
  failed_when: false
  when: ecr_repo_url | length == 0

- name: Set ECR repo URL fact
  ansible.builtin.set_fact:
    ecr_repo_url: "{{ tf_ecr.stdout | trim }}"
  when: ecr_repo_url | length == 0 and tf_ecr.stdout is defined and tf_ecr.stdout | trim | length > 0

- name: Fail early if ECR repo URL is still unknown
  ansible.builtin.fail:
    msg: "ecr_repo_url is empty. Run 'terraform apply' first or pass -e ecr_repo_url=<url>."
  when: ecr_repo_url | length == 0

- name: Derive ECR registry host
  ansible.builtin.set_fact:
    ecr_registry: "{{ ecr_repo_url.split('/')[0] }}"

# Use an isolated DOCKER_CONFIG with no credential helper. The host's global
# ~/.docker/config.json may set a credsStore (e.g. "desktop"/"pass") that isn't
# initialized, which makes `docker login` fail when it tries to SAVE the token.
# An empty config here stores the short-lived ECR token inline instead, and
# leaves the user's global Docker config untouched.
- name: Create an isolated Docker config dir (no credential helper)
  ansible.builtin.tempfile:
    state: directory
    suffix: docker
  register: docker_config

- name: Seed an empty Docker config (disables inherited credsStore)
  ansible.builtin.copy:
    dest: "{{ docker_config.path }}/config.json"
    content: "{}\n"
    mode: "0600"

# The isolated DOCKER_CONFIG above has no Docker contexts, so Docker would fall
# back to the default /var/run/docker.sock (absent when using Docker Desktop).
# Discover the active context's endpoint from the host's real config and target
# it explicitly via DOCKER_HOST, so this works regardless of which context/socket
# the workstation uses.
- name: Discover the active Docker daemon endpoint
  ansible.builtin.command: docker context inspect --format '{{ "{{" }} .Endpoints.docker.Host {{ "}}" }}'
  register: docker_endpoint
  changed_when: false

- name: Build and push the image to ECR
  environment:
    DOCKER_CONFIG: "{{ docker_config.path }}"
    DOCKER_HOST: "{{ docker_endpoint.stdout | trim }}"
  block:
    - name: Log in to ECR
      ansible.builtin.shell: >-
        set -o pipefail;
        aws ecr get-login-password --region {{ aws_region }}
        | docker login --username AWS --password-stdin {{ ecr_registry }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: Build the application image
      ansible.builtin.command:
        cmd: docker build -t {{ ecr_repo_url }}:{{ image_tag }} .
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Push the image to ECR
      ansible.builtin.command: docker push {{ ecr_repo_url }}:{{ image_tag }}
      changed_when: true
  always:
    - name: Remove the isolated Docker config dir
      ansible.builtin.file:
        path: "{{ docker_config.path }}"
        state: absent
