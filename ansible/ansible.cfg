[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# 'yaml' gives prettier output but lives in the community.general collection.
# 'default' is built into ansible-core, so the playbook runs with no extra
# collections. To restore pretty output: ansible-galaxy collection install
# community.general, then set stdout_callback = yaml.
stdout_callback = default
interpreter_python = auto_silent
