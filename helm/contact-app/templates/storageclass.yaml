{{- if .Values.postgres.persistence.createStorageClass }}
# gp3 StorageClass backed by the aws-ebs-csi-driver addon. EKS ships only a
# legacy gp2 class, so we create gp3 here (faster, cheaper, encrypted). Bound
# WaitForFirstConsumer so the EBS volume is created in the pod's AZ.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.postgres.persistence.storageClass }}
  labels: {{- include "contact-app.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
{{- end }}
