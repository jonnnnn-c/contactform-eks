apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "contact-app.fullname" . }}-config
  labels: {{- include "contact-app.labels" . | nindent 4 }}
data:
  DB_HOST: {{ printf "%s-postgres" (include "contact-app.fullname" .) | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
  DB_NAME: {{ .Values.postgres.db.name | quote }}
  DB_USER: {{ .Values.postgres.db.user | quote }}
  LOG_LEVEL: {{ .Values.app.env.LOG_LEVEL | quote }}
