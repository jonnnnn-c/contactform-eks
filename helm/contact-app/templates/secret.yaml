# Only rendered for the dev-convenience path (secret.create=true). In the real
# workflow Ansible creates this Secret from a generated/looked-up password so no
# secret material is ever committed to git or the chart.
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels: {{- include "contact-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secret.dbPassword required when secret.create=true" .Values.secret.dbPassword | quote }}
  FLASK_SECRET_KEY: {{ default (randAlphaNum 48) .Values.secret.flaskSecretKey | quote }}
{{- end }}
