# Minimal, namespace-scoped RBAC. The app needs no API access; this Role is
# intentionally empty of dangerous verbs and only allows reading its own
# ConfigMap, demonstrating least-privilege RBAC.
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "contact-app.fullname" . }}-role
  labels: {{- include "contact-app.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "contact-app.fullname" . }}-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "contact-app.fullname" . }}-rolebinding
  labels: {{- include "contact-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "contact-app.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "contact-app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
